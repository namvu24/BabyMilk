name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: namvu24/babymilk
  DEPLOY_REPO: namvu24/babymilk-deploy

jobs:
  release:
    name: Build, Test & Release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: babymilk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d babymilk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./... -v -count=1

      - name: Run integration tests
        env:
          DATABASE_URL: "postgres://testuser:testpass@localhost:5432/babymilk_test?sslmode=disable"
        run: go test ./... -v -count=1 -tags=integration

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:stable

      - name: Update prod image tag in deploy repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPO }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: babymilk-deploy

      - name: Update prod image tag and ArgoCD targetRevision in deploy repo
        run: |
          cd babymilk-deploy
          TAG="${{ steps.version.outputs.tag }}"

          # Update image tag in Helm values
          sed -i "s|tag:.*|tag: \"${TAG}\"|" charts/babymilk/values-prod.yaml

          # Update ArgoCD targetRevision in root-prod and prod Application manifests
          sed -i "s|targetRevision:.*|targetRevision: refs/tags/${TAG}|" argocd/root-prod.yaml
          sed -i "s|targetRevision:.*|targetRevision: refs/tags/${TAG}|" argocd/bootstrap/prod/prod.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/babymilk/values-prod.yaml argocd/root-prod.yaml argocd/bootstrap/prod/prod.yaml
          git commit -m "chore(prod): update image tag to ${TAG}"
          git tag "${TAG}"
          git push
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ steps.version.outputs.tag }}

name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: namvu24/babymilk
  DEPLOY_REPO: namvu24/babymilk-deploy

jobs:
  build-push:
    name: Build, Test & Push
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: babymilk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d babymilk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./... -v -count=1

      - name: Run integration tests
        env:
          DATABASE_URL: "postgres://testuser:testpass@localhost:5432/babymilk_test?sslmode=disable"
        run: go test ./... -v -count=1 -tags=integration

      - name: Set image tag
        id: tag
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main-${{ steps.tag.outputs.sha_short }}
            ${{ env.IMAGE }}:latest

      - name: Update dev image tag in deploy repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPO }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: babymilk-deploy

      - name: Write new image tag to dev values
        run: |
          cd babymilk-deploy
          sed -i 's|tag:.*|tag: "main-${{ steps.tag.outputs.sha_short }}"|' charts/babymilk/values-dev.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/babymilk/values-dev.yaml
          git commit -m "chore(dev): update image tag to main-${{ steps.tag.outputs.sha_short }}"
          git push

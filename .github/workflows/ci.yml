name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_TEST_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_TEST_DB }}
      POSTGRES_PORT: 5433

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_TEST_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_TEST_DB }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ${{ secrets.POSTGRES_TEST_USER }} -d ${{ secrets.POSTGRES_TEST_DB }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test ./... -v -count=1

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: "postgres://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_DB }}?sslmode=disable"
        run: go test ./... -v -count=1 -tags=integration

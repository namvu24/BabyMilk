name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: babymilk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d babymilk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test ./... -v -count=1

      - name: Run integration tests
        env:
          DATABASE_URL: "postgres://testuser:testpass@localhost:5432/babymilk_test?sslmode=disable"
        run: go test ./... -v -count=1 -tags=integration

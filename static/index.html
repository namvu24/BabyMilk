<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>BabyMilk - Baby Milk Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍼</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <button id="darkModeBtn" class="btn btn-outline-secondary btn-sm rounded-circle p-0 position-fixed" style="width:32px;height:32px;font-size:14px;line-height:32px;top:12px;right:12px;z-index:1050" onclick="toggleDarkMode()" title="Toggle dark mode">🌙</button>
    <div class="container py-4">
        <h1 class="mb-3">🍼 BabyMilk</h1>

        <!-- Tab navigation -->
        <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="milk-tab" data-bs-toggle="tab" data-bs-target="#milkPane" type="button" role="tab" aria-selected="true">🍼 Feeding</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="sleep-tab" data-bs-toggle="tab" data-bs-target="#sleepPane" type="button" role="tab" aria-selected="false">😴 Sleep</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="event-tab" data-bs-toggle="tab" data-bs-target="#eventPane" type="button" role="tab" aria-selected="false">📅 Event</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="dev-tab" data-bs-toggle="tab" data-bs-target="#developmentPane" type="button" role="tab" aria-selected="false">🧒 Development</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="insights-tab" data-bs-toggle="tab" data-bs-target="#insightsPane" type="button" role="tab" aria-selected="false">📊 Insights</button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="milkPane"        role="tabpanel"></div>
            <div class="tab-pane fade"             id="sleepPane"       role="tabpanel"></div>
            <div class="tab-pane fade"             id="eventPane"       role="tabpanel"></div>
            <div class="tab-pane fade"             id="developmentPane" role="tabpanel"></div>
            <div class="tab-pane fade"             id="insightsPane"    role="tabpanel"></div>
        </div><!-- /tab-content -->
    </div>

    <footer class="text-center text-muted py-3" style="font-size:0.8rem">
        <a href="https://github.com/namvu24/BabyMilk" target="_blank" rel="noopener" class="text-muted text-decoration-none"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" style="vertical-align:-2px"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.64 7.64 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg> BabyMilk v3.2.3</a>
    </footer>

    <!-- Toast notification -->
    <div id="toast" class="position-fixed top-0 start-50 translate-middle-x mt-3 px-4 py-2 rounded shadow text-white fw-bold" style="z-index:9999;display:none;transition:opacity 0.3s"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/static/js/app-globals.js"></script>
    <script src="/static/js/app-utils.js"></script>
    <script src="/static/js/app-feeding.js"></script>
    <script src="/static/js/app-sleep.js"></script>
    <script src="/static/js/app-events.js"></script>
    <script src="/static/js/app-development.js"></script>
    <script src="/static/js/app-insights.js"></script>
    <script src="/static/js/app-init.js"></script>
</body>
</html>

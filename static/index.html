<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyMilk - Baby Milk Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍼</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">🍼 BabyMilk</h1>
            <button id="darkModeBtn" class="btn btn-outline-secondary btn-sm" onclick="toggleDarkMode()" title="Toggle dark mode">🌙</button>
        </div>

        <!-- Quick Start/Stop Button -->
        <div class="card mb-4 border-0 bg-transparent shadow-none">
            <div class="d-grid">
                <button id="startStopBtn" class="btn btn-success btn-lg py-3" onclick="toggleFeeding()">
                    ▶ Start Feeding
                </button>
            </div>
            <div id="feedingTimer" class="text-center mt-2 fs-4 fw-bold text-danger d-none"></div>
        </div>

        <!-- Add/Edit Form -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title" id="formTitle">Add Feeding</h5>
                <form id="feedingForm">
                    <input type="hidden" id="editId">
                    <div class="row g-3">
                        <div class="col-12 col-md-4">
                            <label for="amountMl" class="form-label">Amount (ml)</label>
                            <input type="number" class="form-control" id="amountMl" min="1" required>
                            <div id="quickAmounts" class="d-flex gap-1 mt-1 flex-wrap"></div>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="startTime" class="form-label">Start Time</label>
                            <input type="datetime-local" class="form-control" id="startTime" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="endTime" class="form-label">End Time</label>
                            <input type="datetime-local" class="form-control" id="endTime" required>
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1 flex-md-grow-0" id="submitBtn">Add</button>
                        <button type="button" class="btn btn-secondary d-none flex-grow-1 flex-md-grow-0" id="cancelBtn" onclick="cancelEdit()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Daily Chart -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Daily Totals</h5>
                <canvas id="dailyChart" height="100"></canvas>
            </div>
        </div>

        <!-- Feedings Table -->
        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-title mb-0">Feedings</h5>
                    <input type="month" class="form-control w-auto" id="monthFilter" onchange="loadFeedings(); loadDailyTotals()">
                </div>
                <div id="feedingsByDay"></div>
            </div>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="position-fixed top-0 start-50 translate-middle-x mt-3 px-4 py-2 rounded shadow text-white fw-bold" style="z-index:9999;display:none;transition:opacity 0.3s"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>

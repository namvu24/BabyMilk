<!-- Quick Start/Stop Button -->
<div class="card mb-4 border-0 bg-transparent shadow-none">
    <div class="d-grid">
        <button id="startStopBtn" class="btn btn-success btn-lg py-3" onclick="toggleFeeding()">
            ▶ Start Feeding
        </button>
    </div>
    <div id="feedingTimer" class="text-center mt-2 fs-4 fw-bold text-danger d-none"></div>
</div>

<!-- Add/Edit Form -->
<div class="card mb-4">
    <div class="card-body">
        <h5 class="card-title" id="formTitle">Add Feeding</h5>
        <form id="feedingForm">
            <input type="hidden" id="editId">
            <div class="row g-3">
                <div class="col-12 col-md-3">
                    <label for="amountMl" class="form-label">Amount (ml)</label>
                    <input type="number" class="form-control" id="amountMl" min="1" required>
                    <input type="range" class="form-range mt-1" id="amountSlider" min="0" max="200" value="0" oninput="document.getElementById('amountMl').value=this.value">
                    <div id="quickAmounts" class="d-flex gap-1 mt-1 flex-wrap"></div>
                </div>
                <div class="col-12 col-md-3">
                    <label for="feedingDate" class="form-label">Date</label>
                    <input type="date" class="form-control" id="feedingDate" required>
                </div>
                <div class="col-12 col-md-3">
                    <label for="endTime" class="form-label">Time</label>
                    <input type="time" class="form-control" id="endTime" required>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-grow-1 flex-md-grow-0" id="submitBtn">Add</button>
                <button type="button" class="btn btn-secondary d-none flex-grow-1 flex-md-grow-0" id="cancelBtn" onclick="cancelEdit()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- Daily Chart -->
<div class="card mb-4">
    <div class="card-body">
        <h5 class="card-title">Daily Totals</h5>
        <div id="chartWrapper" style="position:relative; height:200px;">
            <canvas id="dailyChart"></canvas>
        </div>
    </div>
</div>

<!-- Feedings Table -->
<div class="card">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title mb-0">Feedings</h5>
            <div class="d-flex align-items-center gap-1">
                <button class="btn btn-outline-secondary btn-sm px-2" onclick="changeMonth(-1)" title="Previous month">◀</button>
                <input type="month" class="form-control form-control-sm w-auto" id="monthFilter" onchange="loadFeedings(); loadDailyTotals()">
                <button class="btn btn-outline-secondary btn-sm px-2" onclick="changeMonth(1)" title="Next month">▶</button>
            </div>
        </div>
        <div id="feedingsByDay"></div>
    </div>
</div>

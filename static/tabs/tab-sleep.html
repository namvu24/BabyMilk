<!-- Quick Start/Stop Sleep Button -->
<div class="card mb-4 border-0 bg-transparent shadow-none">
    <div class="d-grid">
        <button id="sleepStartStopBtn" class="btn btn-sleep btn-lg py-3" onclick="toggleSleepTimer()" aria-label="Start or stop sleep timer">
            😴 Start Sleep
        </button>
    </div>
    <div id="sleepTimerDisplay" class="text-center mt-2 fs-4 fw-bold d-none" style="color:#c7550a" aria-live="polite"></div>
    <!-- Edit start time (visible only during active sleep) -->
    <div id="sleepEditStartRow" class="text-center mt-2 d-none">
        <label for="sleepActiveStartEdit" class="form-label small text-muted mb-1">Started at:</label>
        <div class="d-flex justify-content-center align-items-center gap-2">
            <input type="datetime-local" class="form-control form-control-sm w-auto" id="sleepActiveStartEdit" aria-label="Edit active sleep start time">
            <button class="btn btn-sm btn-outline-secondary" onclick="saveActiveStartTime()" aria-label="Save edited start time">✓ Save</button>
        </div>
    </div>
</div>

<!-- Add/Edit Sleep Form -->
<div class="card mb-4">
    <div class="card-body">
        <h5 class="card-title" id="sleepFormTitle">Add Sleep</h5>
        <form id="sleepForm">
            <input type="hidden" id="sleepEditId">
            <div class="row g-3">
                <div class="col-12 col-md-4">
                    <label for="sleepStart" class="form-label">Start</label>
                    <input type="datetime-local" class="form-control" id="sleepStart" required aria-label="Sleep start date and time">
                </div>
                <div class="col-12 col-md-4">
                    <label for="sleepEnd" class="form-label">End</label>
                    <input type="datetime-local" class="form-control" id="sleepEnd" required aria-label="Sleep end date and time">
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Type</label>
                    <div class="d-flex gap-3 mt-1">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="sleepType" id="sleepNap" value="nap" checked>
                            <label class="form-check-label" for="sleepNap">💤 Nap</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="sleepType" id="sleepNight" value="night">
                            <label class="form-check-label" for="sleepNight">🌙 Night</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-sleep flex-grow-1 flex-md-grow-0" id="sleepSubmitBtn">Add</button>
                <button type="button" class="btn btn-secondary d-none flex-grow-1 flex-md-grow-0" id="sleepCancelBtn" onclick="cancelSleepEdit()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- Daily Sleep Chart -->
<div class="card mb-4">
    <div class="card-body">
        <h5 class="card-title">Daily Sleep Totals</h5>
        <div id="sleepChartWrapper" style="position:relative; height:200px;">
            <canvas id="sleepChart"></canvas>
        </div>
    </div>
</div>

<!-- Sleeps Table -->
<div class="card">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title mb-0">Sleep Sessions</h5>
            <div class="d-flex align-items-center gap-1">
                <button class="btn btn-outline-secondary btn-sm px-2" onclick="changeSleepMonth(-1)" title="Previous month" aria-label="Previous month">◀</button>
                <input type="month" class="form-control form-control-sm w-auto" id="sleepMonthFilter" onchange="loadSleeps(); loadSleepDailyTotals()" aria-label="Filter by month">
                <button class="btn btn-outline-secondary btn-sm px-2" onclick="changeSleepMonth(1)" title="Next month" aria-label="Next month">▶</button>
            </div>
        </div>
        <div id="sleepsByDay"></div>
    </div>
</div>
